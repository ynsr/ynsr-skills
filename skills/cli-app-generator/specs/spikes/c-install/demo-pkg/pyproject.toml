[project]
name = "spikec-demo"
version = "0.1.0"
description = "Spike C scratch package: uv tool install --editable demo"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spikec-demo = "spikec_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spikec_demo"]
