# copier template config — python-project tier (DECISIONS row F scaffolder).
# Rendered by scripts/scaffold.sh: uvx copier copy templates/python-project <dest> -d name=... -d audience=...
# Default Jinja delimiters ({{ }} / {% %}) are safe here: no generated file contains those sequences.
_min_copier_version: "9.0.0"

# Jinja: trim/lstrip block tags so {% if %} lines vanish entirely (no stray blank lines).
_jinja_extensions: []
_envops:
  trim_blocks: true
  lstrip_blocks: true

# NOTE: _exclude REPLACES copier's default exclude list — copier.yml must be re-listed
# (copier's filter_config strips the leading underscore and treats _exclude as the full list).
_exclude:
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - .venv
  - .pytest_cache
  - .ruff_cache

name:
  type: str
  default: mycli
  help: tool name — lowercase letters/digits/underscore; it becomes the package, binary, and env-var prefix
audience:
  type: str
  choices: [human, agent]
  default: agent
  help: primary audience (agent → csv default output, envelope-first errors; recorded in AGENTS.md)
profiles:
  type: bool
  default: false
  help: include profile subcommands + 0600 profile store (spec §2.4 add-on)
wizard:
  type: bool
  default: false
  help: include the questionary picker behind the stderr wrapper (DECISIONS row A; needs --profiles)
