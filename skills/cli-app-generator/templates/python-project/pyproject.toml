[project]
name = "mycli"
version = "0.1.0"
description = "One-line description (short enough for a GitHub repo description)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
dependencies = [
    "httpx[socks]>=0.27",   # socks extra: ALL_PROXY=socks5:// must not crash
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
mycli = "mycli.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
